<div class="settings">

    <nav class="nav-settings glass">
        <p data-i18n="settings.title"></p>
        <div class="nav-box">
            <div id="account" class="nav-settings-btn active-settings-BTN" data-i18n="settings.accounts"></div>
            <div id="java" class="nav-settings-btn" data-i18n="settings.java"></div>
            <div id="resolution" class="nav-settings-btn" data-i18n="settings.resolution"></div>
            <div id="launcher" class="nav-settings-btn" data-i18n="settings.launcher"></div>
        </div>
        <div id="save" class="nav-settings-btn nav-back" data-i18n="settings.back"></div>
        <div class="launcher-version"></div>
    </nav>

    <div class="settings-body">

        <!-- ------------------------------------------------------ contas -->
        <div id="account-tab" class="container-settings active-container-settings content-scroll">
            <div class="titre-tab skin-section" data-i18n="skin.title"></div>
            <div class="settings-elements-box skin-section">
                <div class="setting-text" data-i18n="skin.text"></div>

                <div class="settings-elements content-evenly skin-box">
                    <div class="skin-preview">
                        <img class="skin-body" alt="">
                    </div>

                    <div class="skin-controls">
                        <div class="skin-variant">
                            <div class="theme-btn variant-btn" data-variant="classic" data-i18n="skin.classic"></div>
                            <div class="theme-btn variant-btn" data-variant="slim" data-i18n="skin.slim"></div>
                        </div>
                        <div class="skin-buttons">
                            <div class="skin-choose size-btn" data-i18n="skin.choose"></div>
                            <div class="skin-reset size-btn" data-i18n="skin.reset"></div>
                        </div>
                        <p class="skin-status"></p>
                    </div>
                </div>

                <input type="file" class="skin-file" accept="image/png" hidden>
            </div>

            <div class="titre-tab" data-i18n="settings.accounts"></div>
            <p class="tab-sub" data-i18n="settings.accounts_sub"></p>

            <div class="accounts-list">
                <div class="account" id="add">
                    <div class="add-profile">
                        <div class="icon-account-add"></div>
                    </div>
                    <div class="add-text-profile" data-i18n="settings.add_account"></div>
                </div>
            </div>
        </div>

        <!-- --------------------------------------------------- java/ram -->
        <div id="java-tab" class="container-settings content-scroll">
            <div class="titre-tab" data-i18n="settings.ram_title"></div>
            <div class="settings-elements-box">
                <div class="setting-text" data-i18n-html="settings.ram_text"></div>

                <div class="settings-elements content-evenly">
                    <div class="memory-slider" min="2" max="24" step="0.5">
                        <div class="slider-touch-left"><span value="0 GB"></span></div>
                        <div class="slider-touch-right"><span value="0 GB"></span></div>
                        <div class="slider-line"><span></span></div>
                    </div>

                    <div class="ram-info-block">
                        <div class="ram-stat">
                            <span class="ram-stat-value" id="total-ram">0 GB</span>
                            <span class="ram-stat-label" data-i18n="settings.ram_total"></span>
                        </div>
                        <div class="ram-stat">
                            <span class="ram-stat-value" id="free-ram">0 GB</span>
                            <span class="ram-stat-label" data-i18n="settings.ram_free"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="titre-tab" data-i18n="settings.java_title"></div>
            <div class="settings-elements-box">
                <div class="setting-text">
                    <span data-i18n="settings.java_text"></span><br>
                    <span class="java-path-txt mono"></span><br><br>
                    <span data-i18n="settings.java_hint"></span>
                </div>

                <div class="settings-elements content-evenly">
                    <input type="text" class="java-path-input-text" disabled>
                    <input type="file" class="java-path-input-file" accept="application/octet-stream" />
                    <div class="java-path-box">
                        <div class="java-path-set java-path-btn" data-i18n="settings.java_choose"></div>
                        <div class="java-path-reset java-path-btn" data-i18n="common.default"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- -------------------------------------------------- resolução -->
        <div id="resolution-tab" class="container-settings content-scroll">
            <div class="titre-tab" data-i18n="settings.res_title"></div>
            <div class="settings-elements-box">
                <div class="setting-text" data-i18n="settings.res_text"></div>

                <div class="settings-elements content-center">
                    <div class="input-size-element">
                        <input type="number" class="width-size input-resolution">
                        <div class="size-cross">×</div>
                        <input type="number" class="height-size input-resolution">
                    </div>
                    <div class="size-reset size-btn" data-i18n="common.default"></div>
                </div>
            </div>
        </div>

        <!-- --------------------------------------------------- launcher -->
        <div id="launcher-tab" class="container-settings content-scroll">
            <div class="titre-tab" data-i18n="settings.language"></div>
            <div class="settings-elements-box">
                <div class="setting-text" data-i18n="settings.language_text"></div>
                <div class="settings-elements content-center lang-box"></div>
            </div>

            <div class="titre-tab discord-section" data-i18n="discord.section"></div>
            <div class="settings-elements-box discord-section">
                <div class="setting-text" data-i18n="discord.section_text"></div>
                <div class="settings-elements content-evenly">
                    <div class="discord-account">
                        <img class="discord-avatar" alt="">
                        <div>
                            <div class="discord-name"></div>
                            <div class="discord-sub"></div>
                        </div>
                    </div>
                    <div class="discord-action size-btn"></div>
                </div>
            </div>

            <div class="titre-tab" data-i18n="settings.protected_title"></div>
            <div class="settings-elements-box">
                <div class="setting-text" data-i18n-html="settings.protected_text"></div>
                <div class="settings-elements">
                    <textarea class="protected-list" rows="5"
                        data-i18n-placeholder="settings.protected_placeholder"></textarea>
                </div>
                <div class="settings-elements content-evenly">
                    <p class="protected-hint" data-i18n="settings.protected_hint"></p>
                    <div class="protected-save size-btn" data-i18n="settings.protected_save"></div>
                </div>
            </div>

            <div class="titre-tab" data-i18n="settings.backups_title"></div>
            <div class="settings-elements-box">
                <div class="setting-text">
                    <span data-i18n="settings.backups_text"></span><br>
                    <span class="backup-path-txt mono"></span><br><br>
                    <span data-i18n="settings.backups_hint"></span>
                </div>
                <div class="settings-elements content-evenly">
                    <p class="backup-summary"></p>
                    <div class="backup-open size-btn" data-i18n="settings.backups_open"></div>
                </div>
            </div>

            <div class="titre-tab" data-i18n="settings.downloads_title"></div>
            <div class="settings-elements-box">
                <div class="setting-text" data-i18n="settings.downloads_text"></div>
                <div class="settings-elements content-center">
                    <input type="number" class="max-files input-max-files">
                    <p data-i18n="settings.downloads_unit"></p>
                    <div class="max-files-reset max-files-btn" data-i18n="common.default"></div>
                </div>
            </div>

            <div class="titre-tab" data-i18n="settings.appearance"></div>
            <div class="settings-elements-box">
                <div class="setting-text" data-i18n="settings.appearance_text"></div>
                <div class="settings-elements content-center theme-box">
                    <div class="theme-btn theme-btn-clair" data-i18n="settings.theme_light"></div>
                    <div class="theme-btn theme-btn-sombre" data-i18n="settings.theme_dark"></div>
                    <div class="theme-btn theme-btn-auto" data-i18n="settings.theme_auto"></div>
                </div>
            </div>

            <div class="titre-tab" data-i18n="settings.onlaunch"></div>
            <div class="settings-elements-box">
                <div class="setting-text" data-i18n="settings.onlaunch_text"></div>
                <div class="settings-elements content-evenly close-box">
                    <div class="close-launcher close-btn" data-i18n="settings.close_hide"></div>
                    <div class="close-none close-btn" data-i18n="settings.close_keep"></div>
                    <div class="close-all close-btn" data-i18n="settings.close_all"></div>
                </div>
            </div>
        </div>

    </div>
</div>
