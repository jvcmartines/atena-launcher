<div class="modpack-panel">

    <!-- Mesma casca das configuracoes: menu a esquerda, conteudo a direita.
         Era um popup de 440 px, e o que cabia la dentro tinha que ser
         espremido - a lista de packs virava uma coluna de nomes, e a grade de
         acoes vivia no limite de rolar. Como pagina, cada coisa tem o tamanho
         que precisa. -->
    <nav class="nav-modpack glass">
        <p data-i18n="home.pack_options"></p>

        <div class="pack-side">
            <div class="pack-side-name"></div>
            <div class="pack-side-state"></div>
            <div class="pack-side-version"></div>
        </div>

        <div class="modpack-back nav-back" data-i18n="settings.back"></div>
    </nav>

    <div class="modpack-body content-scroll">

        <div class="titre-tab" data-i18n="modpack.available"></div>
        <p class="tab-sub" data-i18n="modpack.available_text"></p>
        <div class="instances-List"></div>

        <div class="titre-tab" data-i18n="modpack.actions"></div>
        <div class="pack-actions">
            <div class="pack-action" data-action="extras">
                <span class="pack-icon ico-extras"></span>
                <strong data-i18n="extras.title"></strong>
                <small data-i18n="extras.text"></small>
            </div>
            <div class="pack-action" data-action="import">
                <span class="pack-icon ico-import"></span>
                <strong data-i18n="import.title"></strong>
                <small data-i18n="import.text"></small>
            </div>
            <div class="pack-action" data-action="repair">
                <span class="pack-icon ico-repair"></span>
                <strong data-i18n="home.repair"></strong>
                <small data-i18n="home.repair_text"></small>
            </div>
            <div class="pack-action" data-action="changelog">
                <span class="pack-icon ico-changelog"></span>
                <strong data-i18n="home.changelog"></strong>
                <small data-i18n="home.changelog_text"></small>
            </div>
            <div class="pack-action" data-action="folder">
                <span class="pack-icon ico-folder"></span>
                <strong data-i18n="home.open_folder"></strong>
                <small data-i18n="home.open_folder_text"></small>
            </div>
            <div class="pack-action" data-action="report">
                <span class="pack-icon ico-report"></span>
                <strong data-i18n="support.title"></strong>
                <small data-i18n="support.text"></small>
            </div>
            <div class="pack-action" data-action="fps">
                <span class="pack-icon ico-fps"></span>
                <strong data-i18n="fps.title"></strong>
                <small data-i18n="fps.text"></small>
            </div>
            <!-- Apaga o modpack inteiro: fica por ultimo e avisa pela cor. -->
            <div class="pack-action danger" data-action="reinstall">
                <span class="pack-icon ico-reinstall"></span>
                <strong data-i18n="home.reinstall"></strong>
                <small data-i18n="home.reinstall_text"></small>
            </div>
        </div>
    </div>

    <!-- mods opcionais: ligar e desligar o Essential e companhia -->
    <div class="extras-popup">
        <div class="extras-tab glass">
            <div class="close-extras icon-close"></div>
            <p data-i18n="extras.title"></p>
            <div class="extras-intro" data-i18n="extras.intro"></div>
            <div class="extras-list content-scroll"></div>
        </div>
    </div>

    <!-- trazer um modpack que ja esta no computador -->
    <div class="import-popup">
        <div class="import-tab glass">
            <div class="close-import icon-close"></div>
            <p data-i18n="import.title"></p>
            <div class="import-intro" data-i18n="import.intro"></div>
            <div class="import-list content-scroll"></div>
            <div class="row-end">
                <div class="import-browse size-btn" data-i18n="import.browse"></div>
            </div>
        </div>
    </div>

    <!-- FPS Boost: derruba as configuracoes graficas do modpack -->
    <div class="fps-popup">
        <div class="fps-tab glass">
            <div class="close-fps icon-close"></div>
            <p data-i18n="fps.title"></p>
            <div class="fps-intro" data-i18n="fps.intro"></div>

            <div class="fps-state">
                <div class="fps-state-text"></div>
                <button class="fps-toggle"></button>
            </div>

            <div class="fps-changes content-scroll"></div>
        </div>
    </div>
</div>
