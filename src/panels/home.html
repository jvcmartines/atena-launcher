<div class="home">

    <main class="hero">
        <!-- A logo sobe: no centro exato ela disputava atencao com o botao, e
             os dois juntos empurravam o resto da tela para o rodape. -->
        <div class="hero-top">
            <img class="brand-logo" src="assets/images/atena-logo.png" alt="Atena Launcher">
        </div>

        <!-- banido, ou sem nenhum modpack liberado: a razao aparece aqui -->
        <div class="blocked-box glass">
            <div class="blocked-title"></div>
            <div class="blocked-text"></div>
        </div>

        <div class="play-elements">
            <!-- So o botao. O de opcoes do modpack ficava colado aqui do lado,
                 e os dois juntos eram centralizados como um par - o que deixava
                 o JOGAR visivelmente fora do meio da tela. Ele foi para a barra,
                 junto dos outros botoes de servico. -->
            <div class="play-instance">
                <button class="play-btn" data-i18n="home.play"></button>
            </div>

            <!-- As tres decisoes que se tomam na hora de jogar, e nao uma vez
                 na vida: entrar direto, jogar leve, jogar com o Essential.
                 Estavam espalhadas entre as configuracoes e o menu do modpack. -->
            <div class="toggles">
                <label class="toggle" data-toggle="autojoin">
                    <input type="checkbox" class="toggle-input autojoin-input">
                    <span class="toggle-switch"></span>
                    <span class="toggle-text" data-i18n="home.autojoin_short"></span>
                </label>

                <label class="toggle" data-toggle="fps" hidden>
                    <input type="checkbox" class="toggle-input fps-input">
                    <span class="toggle-switch"></span>
                    <span class="toggle-text" data-i18n="fps.title"></span>
                </label>

                <label class="toggle" data-toggle="essential" hidden>
                    <input type="checkbox" class="toggle-input essential-input">
                    <span class="toggle-switch"></span>
                    <span class="toggle-text"></span>
                </label>
            </div>

            <div class="info-starting-game">
                <div class="info-starting-game-text" data-i18n="home.connecting"></div>
                <progress value="0" max="0" class="progress-bar"></progress>
                <div class="download-stats">
                    <span class="download-speed"></span>
                    <span class="download-eta"></span>
                </div>
                <!-- Pausar e cancelar so aparecem durante o download do modpack. -->
                <div class="download-actions">
                    <button class="download-btn pause-btn" data-i18n="home.pause" hidden></button>
                    <button class="download-btn cancel-btn" data-i18n="home.cancel" hidden></button>
                </div>
            </div>
        </div>

        <!-- O aviso mais recente da staff, a um clique da lista inteira. -->
        <button class="news-strip" hidden>
            <span class="news-strip-tag" data-i18n="news.tag"></span>
            <span class="news-strip-title"></span>
        </button>
    </main>

    <!-- Barra escura: a imagem de fundo cobria a tela inteira e os botoes
         flutuavam soltos em cima dela. Aqui eles ganham chao. -->
    <footer class="home-bottom">
        <!-- Esquerda: quem esta jogando. O cartao leva as contas, e as
             estatisticas ficam ao lado dele porque sao a mesma coisa -
             numeros desta pessoa. Estavam na direita, junto de coisas que nao
             tem nada com ela. -->
        <div class="bottom-left">
            <button class="account-chip" data-i18n-title="account.manage">
                <div class="head-wrap">
                    <div class="player-head"></div>
                    <img class="discord-badge" alt="">
                </div>
                <div class="account-meta">
                    <div class="player-line">
                        <span class="player-name" data-i18n="account.loading"></span>
                        <span class="staff-badge" data-i18n="account.staff"></span>
                        <!-- Horas jogadas, vindas do mundo do servidor. Some quando
                             o nick nunca entrou. -->
                        <span class="player-hours" hidden></span>
                    </div>
                    <div class="player-type" data-i18n="account.connected"></div>
                </div>
            </button>

            <div class="bar-btn stats-btn" data-i18n-title="stats.title">
                <span class="bar-icon ico-stats"></span>
                <span class="bar-label" data-i18n="stats.bar"></span>
            </div>
        </div>

        <div class="bottom-right">
            <div class="status-player-count" data-i18n-title="home.players_title">
                <span class="pulse-dot"></span>
                <span class="player-count">0</span>
                <span class="players-label" data-i18n="home.players_label"></span>
            </div>

            <div class="bar-sep"></div>

            <div class="bar-btn pack-menu-btn" data-i18n-title="home.pack_options">
                <span class="bar-icon ico-pack"></span>
                <span class="bar-label" data-i18n="home.bar_pack"></span>
            </div>

            <div class="bar-btn news-btn" data-i18n-title="news.title">
                <span class="bar-icon ico-news"></span>
                <span class="bar-label" data-i18n="home.bar_news"></span>
                <span class="news-dot" hidden></span>
            </div>

            <div class="bar-btn support-btn" data-i18n-title="support.bar_title">
                <span class="bar-icon ico-support"></span>
                <span class="bar-label" data-i18n="home.bar_support"></span>
            </div>

            <div class="bar-btn social-block" data-url="https://discord.gg/92cDk8rZKK" title="Discord">
                <span class="bar-icon ico-discord-bar"></span>
            </div>

            <div class="bar-btn social-block" data-url="https://atenasmp.com" title="atenasmp.com">
                <span class="bar-icon ico-web-bar"></span>
            </div>

            <div class="bar-btn settings-btn" data-i18n-title="home.settings_title">
                <span class="bar-icon ico-gear"></span>
            </div>
        </div>
    </footer>

    <!-- quem está jogando agora -->
    <div class="players-popup">
        <div class="players-tab glass">
            <div class="close-players icon-close"></div>
            <p data-i18n="home.players_title"></p>
            <div class="players-count-line"></div>
            <!-- O IP saiu do rodape para a barra respirar, mas copiar continua
                 a um clique - aqui, junto de quem esta online. -->
            <div class="ip-row" data-i18n-title="home.ip_title">
                <span class="server-ip">atenasmp.com</span>
                <span class="ip-copy" data-i18n="home.ip_copy"></span>
            </div>
            <div class="players-list content-scroll"></div>
        </div>
    </div>

        <!-- avisos da staff -->
    <div class="news-popup">
        <div class="news-tab glass">
            <div class="close-news icon-close"></div>
            <p data-i18n="news.title"></p>
            <div class="news-list content-scroll"></div>
        </div>
    </div>

                <!-- o que mudou no modpack -->
    <div class="changelog-popup">
        <div class="changelog-tab glass">
            <div class="close-changelog icon-close"></div>
            <p data-i18n="home.changelog"></p>
            <div class="changelog-intro"></div>
            <div class="changelog-list content-scroll"></div>
            <div class="row-end">
                <div class="changelog-ok size-btn" data-i18n="common.ok"></div>
            </div>
        </div>
    </div>
</div>
