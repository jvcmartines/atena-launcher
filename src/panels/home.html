<div class="home">

    <main class="hero">
        <!-- A logo sobe: no centro exato ela disputava atencao com o botao, e
             os dois juntos empurravam o resto da tela para o rodape. -->
        <div class="hero-top">
            <img class="brand-logo" src="assets/images/atena-logo.png" alt="Atena Launcher">
        </div>

        <!-- banido, ou sem nenhum modpack liberado: a razao aparece aqui -->
        <div class="blocked-box glass">
            <div class="blocked-title"></div>
            <div class="blocked-text"></div>
        </div>

        <div class="play-elements">
            <div class="play-instance">
                <button class="play-btn" data-i18n="home.play"></button>
                <div class="pack-menu-btn" data-i18n-title="home.pack_options">
                    <span class="pack-menu-icon"></span>
                </div>
            </div>

            <!-- Entrar direto no servidor, sem passar pelo menu de multijogador.
                 Estava escondido nas configuracoes; e uma decisao que se toma na
                 hora de jogar, entao mora aqui. -->
            <label class="autojoin">
                <input type="checkbox" class="autojoin-input">
                <span class="autojoin-switch"></span>
                <span class="autojoin-text" data-i18n="home.autojoin"></span>
            </label>

            <div class="info-starting-game">
                <div class="info-starting-game-text" data-i18n="home.connecting"></div>
                <progress value="0" max="0" class="progress-bar"></progress>
                <div class="download-stats">
                    <span class="download-speed"></span>
                    <span class="download-eta"></span>
                </div>
                <!-- Pausar e cancelar so aparecem durante o download do modpack. -->
                <div class="download-actions">
                    <button class="download-btn pause-btn" data-i18n="home.pause" hidden></button>
                    <button class="download-btn cancel-btn" data-i18n="home.cancel" hidden></button>
                </div>
            </div>
        </div>

        <!-- O aviso mais recente da staff, a um clique da lista inteira. -->
        <button class="news-strip" hidden>
            <span class="news-strip-tag" data-i18n="news.tag"></span>
            <span class="news-strip-title"></span>
        </button>
    </main>

    <!-- Barra escura: a imagem de fundo cobria a tela inteira e os botoes
         flutuavam soltos em cima dela. Aqui eles ganham chao. -->
    <footer class="home-bottom">
        <!-- O cartao do jogador virou botao: leva as contas, onde se troca e
             se acrescenta. -->
        <button class="account-chip" data-i18n-title="account.manage">
            <div class="head-wrap">
                <div class="player-head"></div>
                <img class="discord-badge" alt="">
            </div>
            <div class="account-meta">
                <div class="player-line">
                    <span class="player-name" data-i18n="account.loading"></span>
                    <span class="staff-badge" data-i18n="account.staff"></span>
                    <!-- Horas jogadas, vindas do mundo do servidor. Some quando
                         o nick nunca entrou. -->
                    <span class="player-hours" hidden></span>
                </div>
                <div class="player-type" data-i18n="account.connected"></div>
            </div>
        </button>

        <div class="bottom-right">
            <div class="status-player-count" data-i18n-title="home.players_title">
                <span class="pulse-dot"></span>
                <span class="player-count">0</span>
                <span class="players-label" data-i18n="home.players_label"></span>
            </div>

            <div class="bar-sep"></div>

            <div class="bar-btn news-btn" data-i18n-title="news.title">
                <span class="bar-icon ico-news"></span>
                <span class="news-dot" hidden></span>
            </div>

            <div class="bar-btn support-btn" data-i18n-title="support.bar_title">
                <span class="bar-icon ico-support"></span>
            </div>

            <div class="bar-btn social-block" data-url="https://discord.gg/92cDk8rZKK" title="Discord">
                <span class="bar-icon ico-discord-bar"></span>
            </div>

            <div class="bar-btn social-block" data-url="https://atenasmp.com" title="atenasmp.com">
                <span class="bar-icon ico-web-bar"></span>
            </div>

            <div class="bar-btn settings-btn" data-i18n-title="home.settings_title">
                <span class="bar-icon ico-gear"></span>
            </div>
        </div>
    </footer>

    <!-- quem está jogando agora -->
    <div class="players-popup">
        <div class="players-tab glass">
            <div class="close-players icon-close"></div>
            <p data-i18n="home.players_title"></p>
            <div class="players-count-line"></div>
            <!-- O IP saiu do rodape para a barra respirar, mas copiar continua
                 a um clique - aqui, junto de quem esta online. -->
            <div class="ip-row" data-i18n-title="home.ip_title">
                <span class="server-ip">atenasmp.com</span>
                <span class="ip-copy" data-i18n="home.ip_copy"></span>
            </div>
            <div class="players-list content-scroll"></div>
        </div>
    </div>

    <!-- opções do modpack: trocar, reinstalar, abrir a pasta -->
    <div class="instance-popup">
        <div class="instances-tab glass">
            <div class="close-popup icon-close"></div>
            <p data-i18n="home.pack_options"></p>

            <div class="pack-summary">
                <span class="current-instance-name">Atena</span>
                <span class="pack-state"></span>
            </div>

            <div class="instances-List content-scroll"></div>

            <!-- Grade em vez de lista: sete paragrafos empilhados viravam uma
                 parede de texto que ninguem lia ate o fim. Aqui cada acao e um
                 quadrado com icone, e a vista bate em tudo de uma vez. -->
            <div class="pack-actions">
                <div class="pack-action" data-action="extras">
                    <span class="pack-icon ico-extras"></span>
                    <strong data-i18n="extras.title"></strong>
                    <small data-i18n="extras.text"></small>
                </div>
                <div class="pack-action" data-action="import">
                    <span class="pack-icon ico-import"></span>
                    <strong data-i18n="import.title"></strong>
                    <small data-i18n="import.text"></small>
                </div>
                <div class="pack-action" data-action="repair">
                    <span class="pack-icon ico-repair"></span>
                    <strong data-i18n="home.repair"></strong>
                    <small data-i18n="home.repair_text"></small>
                </div>
                <div class="pack-action" data-action="changelog">
                    <span class="pack-icon ico-changelog"></span>
                    <strong data-i18n="home.changelog"></strong>
                    <small data-i18n="home.changelog_text"></small>
                </div>
                <div class="pack-action" data-action="folder">
                    <span class="pack-icon ico-folder"></span>
                    <strong data-i18n="home.open_folder"></strong>
                    <small data-i18n="home.open_folder_text"></small>
                </div>
                <div class="pack-action" data-action="report">
                    <span class="pack-icon ico-report"></span>
                    <strong data-i18n="support.title"></strong>
                    <small data-i18n="support.text"></small>
                </div>
                <div class="pack-action" data-action="fps">
                    <span class="pack-icon ico-fps"></span>
                    <strong data-i18n="fps.title"></strong>
                    <small data-i18n="fps.text"></small>
                </div>
                <!-- Apaga o modpack inteiro: fica por ultimo, e avisa pela cor. -->
                <div class="pack-action danger" data-action="reinstall">
                    <span class="pack-icon ico-reinstall"></span>
                    <strong data-i18n="home.reinstall"></strong>
                    <small data-i18n="home.reinstall_text"></small>
                </div>
            </div>
        </div>
    </div>

    <!-- avisos da staff -->
    <div class="news-popup">
        <div class="news-tab glass">
            <div class="close-news icon-close"></div>
            <p data-i18n="news.title"></p>
            <div class="news-list content-scroll"></div>
        </div>
    </div>

    <!-- FPS Boost: derruba as configuracoes graficas do modpack -->
    <div class="fps-popup">
        <div class="fps-tab glass">
            <div class="close-fps icon-close"></div>
            <p data-i18n="fps.title"></p>
            <div class="fps-intro" data-i18n="fps.intro"></div>

            <div class="fps-state">
                <div class="fps-state-text"></div>
                <button class="fps-toggle"></button>
            </div>

            <div class="fps-changes content-scroll"></div>
        </div>
    </div>

    <!-- mods opcionais: Essential e companhia -->
    <div class="extras-popup">
        <div class="extras-tab glass">
            <div class="close-extras icon-close"></div>
            <p data-i18n="extras.title"></p>
            <div class="extras-intro" data-i18n="extras.intro"></div>
            <div class="extras-list content-scroll"></div>
        </div>
    </div>

    <!-- trazer um modpack que ja esta no computador -->
    <div class="import-popup">
        <div class="import-tab glass">
            <div class="close-import icon-close"></div>
            <p data-i18n="import.title"></p>
            <div class="import-intro" data-i18n="import.intro"></div>
            <div class="import-list content-scroll"></div>
            <div class="row-end">
                <div class="import-browse size-btn" data-i18n="import.browse"></div>
            </div>
        </div>
    </div>

    <!-- o que mudou no modpack -->
    <div class="changelog-popup">
        <div class="changelog-tab glass">
            <div class="close-changelog icon-close"></div>
            <p data-i18n="home.changelog"></p>
            <div class="changelog-intro"></div>
            <div class="changelog-list content-scroll"></div>
            <div class="row-end">
                <div class="changelog-ok size-btn" data-i18n="common.ok"></div>
            </div>
        </div>
    </div>
</div>
