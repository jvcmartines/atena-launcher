<div class="home">

    <main class="hero">
        <img class="brand-logo" src="assets/images/atena-logo.png" alt="Atena Launcher">

        <!-- só quantos estão jogando; o resto sai da frente -->
        <div class="stat glass status-player-count" data-i18n-title="home.players_title">
            <div class="stat-value player-count">0</div>
            <div class="stat-label players-label" data-i18n="home.players_label"></div>
        </div>

        <!-- banido, ou sem nenhum modpack liberado: a razao aparece aqui -->
        <div class="blocked-box glass">
            <div class="blocked-title"></div>
            <div class="blocked-text"></div>
        </div>

        <div class="play-elements">
            <div class="play-instance">
                <button class="play-btn" data-i18n="home.play"></button>
                <div class="pack-menu-btn icon-settings" data-i18n-title="home.pack_options"></div>
            </div>

            <div class="info-starting-game">
                <div class="info-starting-game-text" data-i18n="home.connecting"></div>
                <progress value="0" max="0" class="progress-bar"></progress>
                <div class="download-stats">
                    <span class="download-speed"></span>
                    <span class="download-eta"></span>
                </div>
            </div>
        </div>
    </main>

    <footer class="home-bottom">
        <div class="account-chip">
            <div class="player-head"></div>
            <div class="account-meta">
                <div class="player-name" data-i18n="account.loading"></div>
                <div class="player-type" data-i18n="account.connected"></div>
            </div>
        </div>

        <div class="bottom-right">
            <!-- o IP saiu do meio da tela, mas continua a um clique -->
            <div class="ip-row" data-i18n-title="home.ip_title">
                <span class="server-ip">atenasmp.com</span>
                <span class="ip-copy" data-i18n="home.ip_copy"></span>
            </div>

            <div class="social-list">
                <div data-url="https://atenasmp.com" class="social-block" title="Site">
                    <div class="icon-web icon-social"></div>
                </div>
                <div data-url="https://discord.gg/92cDk8rZKK" class="social-block" title="Discord">
                    <div class="icon-discord icon-social"></div>
                </div>
                <div data-url="https://www.tiktok.com/@SEU-PERFIL" class="social-block" title="TikTok">
                    <div class="icon-tiktok icon-social"></div>
                </div>
                <div data-url="https://www.youtube.com/@SEU-CANAL" class="social-block" title="YouTube">
                    <div class="icon-youtube icon-social"></div>
                </div>
            </div>

            <div class="settings-btn icon-settings" data-i18n-title="home.settings_title"></div>
        </div>
    </footer>

    <!-- quem está jogando agora -->
    <div class="players-popup">
        <div class="players-tab glass">
            <div class="close-players icon-close"></div>
            <p data-i18n="home.players_title"></p>
            <div class="players-count-line"></div>
            <div class="players-list content-scroll"></div>
        </div>
    </div>

    <!-- opções do modpack: trocar, reinstalar, abrir a pasta -->
    <div class="instance-popup">
        <div class="instances-tab glass">
            <div class="close-popup icon-close"></div>
            <p data-i18n="home.pack_options"></p>

            <div class="pack-summary">
                <span class="current-instance-name">Atena</span>
                <span class="pack-state"></span>
            </div>

            <div class="instances-List content-scroll"></div>

            <div class="pack-actions">
                <div class="pack-action" data-action="reinstall">
                    <strong data-i18n="home.reinstall"></strong>
                    <small data-i18n="home.reinstall_text"></small>
                </div>
                <div class="pack-action" data-action="folder">
                    <strong data-i18n="home.open_folder"></strong>
                    <small data-i18n="home.open_folder_text"></small>
                </div>
            </div>
        </div>
    </div>
</div>
