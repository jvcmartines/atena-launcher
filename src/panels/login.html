<div class="login-wrap">
    <img class="login-logo" src="assets/images/atena-logo.png" alt="Atena Launcher">

    <div class="login-card glass">

        <div class="login-discord login-tabs">
            <div class="login-badge" data-i18n="discord.badge"></div>
            <div class="login-title" data-i18n="discord.title"></div>
            <div class="login-text" data-i18n="discord.text"></div>

            <div class="discord-linked" style="display:none">
                <img class="discord-avatar" alt="">
                <div class="discord-name"></div>
            </div>

            <div class="login-options">
                <button class="connect connect-discord" data-i18n="discord.connect"></button>
            </div>

            <div class="discord-status"></div>
        </div>

        <div class="login-home login-tabs">
            <div class="login-badge" data-i18n="login.badge"></div>
            <div class="login-title" data-i18n="login.welcome"></div>
            <div class="login-text" data-i18n="login.microsoft_text"></div>

            <div class="login-options">
                <button class="connect connect-home" data-i18n="login.microsoft_button"></button>
                <button class="cancel cancel-home" style="display: none;" data-i18n="common.back"></button>
            </div>
        </div>

        <div class="login-offline login-tabs">
            <div class="login-title" data-i18n="login.offline_title"></div>
            <div class="login-text" data-i18n="login.offline_text"></div>

            <div class="input-login">
                <input type="text" class="email email-offline" data-i18n-placeholder="login.offline_input" />
            </div>

            <div class="login-options">
                <button class="connect connect-offline" data-i18n="login.offline_button"></button>
                <button class="cancel cancel-offline" style="display: none;" data-i18n="common.back"></button>
            </div>
        </div>

        <div class="login-AZauth login-tabs">
            <div class="login-title" data-i18n="login.az_title"></div>
            <div class="login-text" data-i18n="login.az_text"></div>

            <div class="input-login">
                <input type="text" class="email email-AZauth" data-i18n-placeholder="login.az_email" />
                <input type="password" class="password password-AZauth" data-i18n-placeholder="login.az_password" />
            </div>

            <div class="login-options">
                <button class="connect connect-AZauth" data-i18n="login.offline_button"></button>
                <button class="cancel cancel-AZauth" style="display: none;" data-i18n="common.back"></button>
            </div>
        </div>

        <div class="login-AZauth-A2F login-tabs">
            <div class="login-title" data-i18n="login.a2f_title"></div>
            <div class="login-text" data-i18n="login.a2f_text"></div>

            <div class="input-login">
                <input type="text" class="A2F A2F-AZauth" data-i18n-placeholder="login.a2f_input" />
            </div>

            <div class="login-options">
                <button class="connect connect-AZauth-A2F" data-i18n="login.a2f_confirm"></button>
                <button class="cancel cancel-AZauth-A2F" data-i18n="common.back"></button>
            </div>
        </div>

    </div>
</div>
