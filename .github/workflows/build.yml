# Compila o Atena Launcher para Windows, macOS e Linux e publica os
# instaladores numa release do GitHub.
#
# Como usar:
#   1. Suba a "version" no package.json (ex.: 1.0.0 -> 1.0.1)
#   2. git commit && git push para a branch master
#   3. O workflow cria a tag/release e anexa os instaladores
#
# O launcher se auto-atualiza a partir dessa release, então a "version" do
# package.json precisa ser SEMPRE maior que a da última release publicada.

name: Build do Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler a versão do package.json
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Criar a release (se ainda não existir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.version }}
        run: |
          if gh release view "$version" >/dev/null 2>&1; then
            echo "A release $version já existe, seguindo em frente."
            exit 0
          fi

          # Versões com "beta" ou "alpha" saem marcadas como pré-lançamento.
          flags=""
          case "$version" in
            *beta*|*alpha*) flags="--prerelease" ;;
          esac

          gh release create "$version" \
            --title "Atena Launcher $version" \
            --generate-notes $flags

  build-launcher:
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Instalar dependências
        run: npm ci
        shell: bash

      # Pega variável usada e nunca declarada — erro que passa no parser e só
      # explode quando a linha roda. Já quebrou a atualização do modpack uma
      # vez; não pode virar release de novo.
      - name: Conferir as variáveis do launcher
        run: npm run conferir
        shell: bash

      - name: Compilar e publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:ci
        shell: bash
